  <g stroke="#2A2722" stroke-width="28" stroke-linecap="round" fill="none">
    <!-- 茎：从土里立起 -->
    <path d="M256 432 L256 250"/>
    <!-- 左叶（上举） -->
    <path d="M256 274 C 216 268 188 232 190 186 C 238 190 264 226 256 274 Z"/>
    <!-- 右叶（上举，略高） -->
    <path d="M256 250 C 302 244 332 206 330 158 C 280 162 252 200 256 250 Z"/>
  </g>
</svg>
