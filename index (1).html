<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF9F5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="问题花园">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Quesden · 问题花园</title>
<style>
  /* ===== Tokens（quesden/01 推导）=====
     间距 1×/2×/4×：12 / 24 / 48 · 缩进档 28 · 版心 20
     文本：种子 20/600/1.5 · 养分 15/400/1.55 · 元数据 12/400
     纸 #FAF9F5 · 墨 #2A2722 · 强调色只给"输入中/落位中" */
  :root {
    --paper:#FAF9F5; --ink:#2A2722; --ink55:rgba(42,39,34,.55);
    --accent:#3B6EF6;
    --g1:12px; --g2:24px; --g4:48px; --indent:28px; --pad:20px;
    --m-settle:350ms; --ease:cubic-bezier(0.32,0.72,0,1);
    --capture-h:190px; /* 由 JS 实时同步（输入框增高时跟随） */
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; background:#E9E6DF; font-family:-apple-system,"PingFang SC","Noto Sans SC",sans-serif; }
  #device { width:390px; height:844px; margin:24px auto; background:var(--paper); color:var(--ink);
    border-radius:24px; overflow:hidden; position:relative; box-shadow:0 0 0 8px #DDD9D0; }
  .screen { position:absolute; inset:0; background:var(--paper); overflow-y:auto;
    transform:translateX(100%); transition:transform var(--m-settle) var(--ease); visibility:hidden; }
  .screen.active { transform:none; visibility:visible; }
  /* 详情页拆成两层：内层滚动，入口固定在外层底部——入口永不随内容滚走 */
  #detail { overflow-y:hidden; display:flex; flex-direction:column; }
  #detail .detail { flex:1; overflow-y:auto; padding:calc(44px + env(safe-area-inset-top, 0px)) var(--pad) var(--g4); }
  ::-webkit-scrollbar { display:none; }
  input,button,textarea { font-family:inherit; }

  /* ===== 主页 ===== */
  /* 顶部用 env(safe-area-inset-top) 兜住刘海屏/灵动岛（桌面端 env=0 时回退 44px） */
  .capture { position:sticky; top:0; z-index:5; background:var(--paper); padding:calc(44px + env(safe-area-inset-top, 0px)) var(--pad) var(--g2); }
  .capture .brand { font-size:12px; color:var(--ink55); margin-bottom:var(--g2); display:flex; justify-content:space-between; }
  .capture .brand b { color:var(--ink); font-weight:600; }
  .cap-row { position:relative; }
  /* 检索行：常态只是一行 12px 文字（右对齐的「找」），点开才成为输入框。
     权重比捕获框低一档——捕获是主体，检索是工具。 */
  .search-row { display:flex; align-items:baseline; gap:var(--g1); margin:-6px 0 6px; padding-bottom:0; }
  .search-row .find { background:none; border:none; cursor:pointer; padding:0;
    font-size:12px; color:var(--ink55); white-space:nowrap; }
  #searchInput { flex:1; min-width:0; border:none; background:none; outline:none;
    font-size:12px; color:var(--ink); caret-color:var(--accent);
    opacity:0; pointer-events:none; transition:opacity 200ms var(--ease); }
  .search-row.open #searchInput { opacity:1; pointer-events:auto; }
  .search-row.open .find { display:none; }
  .search-note { font-size:12px; color:var(--ink55); padding-bottom:var(--g1); display:flex; justify-content:space-between; gap:var(--g1); }
  .search-note button { background:none; border:none; color:var(--ink55); font-size:12px; cursor:pointer; padding:0; white-space:nowrap; }
  /* 凋谢归档：一行文字，无回收站概念 */
  .fallen-row { display:block; background:none; border:none; cursor:pointer;
    font-size:12px; color:var(--ink55); padding:var(--g1) 0 0; text-align:left; }
  /* 聚合时间戳：标题下一行极小元数据，零视觉重量 */
  .d-life { font-size:12px; color:var(--ink55); margin-top:var(--g1); }
  #captureInput { width:100%; border:none; background:none; outline:none; resize:none; overflow:hidden;
    font-size:20px; font-weight:600; line-height:1.5; color:var(--ink);
    caret-color:var(--accent); border-bottom:1px solid transparent; padding:0 64px 6px 0;
    transition:border-color var(--m-settle) var(--ease); }
  #captureInput::placeholder { color:var(--ink55); font-weight:400; }
  #captureInput:focus { border-bottom-color:var(--accent); }
  #pasteSim { position:absolute; right:0; bottom:8px; background:none; border:none; cursor:pointer;
    font-size:12px; color:var(--ink55); padding:4px 0; }
  .stats { font-size:12px; color:var(--ink55); margin-top:var(--g1); min-height:1.4em; }
  .garden { padding:0 var(--pad) calc(48px + env(safe-area-inset-bottom, 0px)); }
  /* 吸顶段首日期：滚动时的分组锚点（排版逻辑，非装饰） */
  .day-sec { position:relative; }
  /* 日期行与原问题之间的呼吸：由 label 的下边距提供，与株间 4× 区分 */
  .day-label { position:sticky; top:var(--capture-h); z-index:4; background:var(--paper);
    font-size:12px; color:var(--ink55); margin:0 0 var(--g2); padding:var(--g1) 0 6px; }
  .day-sec + .day-sec { margin-top:var(--g4); }
  .day-sec:first-of-type .day-label { margin-top:var(--g2); }
  .seed { margin-bottom:var(--g4); cursor:pointer; }
  .seed .q { font-size:20px; font-weight:600; line-height:1.5; max-height:3em; /* 恰好两行 */
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .seed.resolved .q { text-decoration:line-through; text-decoration-thickness:1px; }
  .seed .n-count { font-size:12px; color:var(--ink55); margin-top:var(--g1); display:inline-block; }
  .seed .sprout { margin-top:var(--g2); padding-left:var(--indent); font-size:15px; line-height:1.55; }
  .seed .sprout a { color:var(--ink); text-decoration:underline; text-underline-offset:3px; }
  .seed .sprout .more { display:block; font-size:12px; color:var(--ink55); margin-top:2px; }

  /* ===== 详情 ===== */
  .detail { padding:calc(44px + env(safe-area-inset-top, 0px)) var(--pad) var(--g4); }
  .back { background:none; border:none; color:var(--ink55); font-size:20px; cursor:pointer; padding:var(--g1) 0; display:block; }
  .d-meta { font-size:12px; color:var(--ink55); margin:var(--g2) 0; display:flex; gap:var(--g2); align-items:baseline; }
  .d-meta .resolve { margin-left:auto; background:none; border:none; color:var(--ink55); font-size:12px; cursor:pointer; padding:0; }
  .d-meta .resolve.done { color:var(--ink); }
  .d-q { font-size:20px; font-weight:600; line-height:1.5; }
  .d-q.done { text-decoration:line-through; text-decoration-thickness:1px; }
  .nutrients { margin-top:var(--g2); padding-left:var(--indent); }
  .nutrient { font-size:15px; font-weight:400; line-height:1.55; margin-bottom:var(--g1); cursor:pointer; }
  .nutrient .when { display:block; font-size:12px; color:var(--ink55); margin-top:2px; }
  .nutrient .del { display:none; font-size:12px; color:var(--ink55); margin-left:var(--g2); }
  .nutrient .del:hover { color:var(--ink); }
  .nutrient.confirm .del { display:inline; } /* 点按元数据区 → 原位出现"删除"，无弹窗无按钮 */
  .nutrient a { color:var(--ink); text-decoration:underline; text-underline-offset:3px; }
  .nutrient.land { animation:settle var(--m-settle) var(--ease) both; }
  @keyframes settle {
    from { transform:translateY(-1.55em); opacity:.7; }
    to   { transform:translateY(0);      opacity:1; }
  }
  .no-nutrient { font-size:12px; color:var(--ink55); margin-top:var(--g2); }

  /* 贴养分入口：固定在外层底部，一行文字；standalone 下避开手势条 */
  .attach-row { flex:none; padding:var(--g2) var(--pad) calc(36px + env(safe-area-inset-bottom, 0px)); background:var(--paper); }
  #detail .detail { padding-bottom:var(--g4); }
  .attach-open { background:none; border:none; color:var(--ink55); font-size:15px; cursor:pointer; padding:var(--g1) 0; }
  .attach-box { display:none; }
  .attach-box.on { display:block; }
  #nutrientInput { width:100%; border:none; background:none; outline:none;
    font-size:15px; line-height:1.55; color:var(--ink);
    caret-color:var(--accent); border-bottom:1px solid var(--ink55); padding:var(--g1) 0; }
  #nutrientInput:focus { border-bottom-color:var(--accent); }
  .attach-tip { font-size:12px; color:var(--ink55); margin-top:var(--g1); }
  .attach-tip b { color:var(--accent); font-weight:400; }

  /* ===== 附着选择器（外部链接分流）：整层纸张，无卡片 ===== */
  #chooser { position:absolute; inset:0; background:var(--paper); z-index:10; display:none;
    padding:calc(44px + env(safe-area-inset-top, 0px)) var(--pad); overflow-y:auto; }
  #chooser.on { display:block; }
  #chooser h2 { font-size:20px; font-weight:600; line-height:1.5; margin-bottom:var(--g1); }
  #chooser .sub { font-size:12px; color:var(--ink55); margin-bottom:var(--g4); word-break:break-all; }
  .choice { font-size:15px; line-height:1.55; padding:var(--g1) 0; cursor:pointer; }
  .choice small { display:block; font-size:12px; color:var(--ink55); margin-top:2px; }
  .choice.new { color:var(--ink55); margin-top:var(--g2); }
  #chooser .cancel { margin-top:var(--g4); background:none; border:none; color:var(--ink55); font-size:12px; cursor:pointer; padding:0; }
</style>
</head>
<body>
<div id="device">

  <!-- 主页 -->
  <section id="home" class="screen active">
    <div class="capture" id="capture">
      <div class="brand"><b>问题花园</b> · Quesden</div>
      <div class="search-row" id="searchRow">
        <button class="find" id="findBtn">找</button>
        <input id="searchInput" type="text" placeholder="输入关键字，列表原地过滤" autocomplete="off">
      </div>
      <div class="cap-row">
        <textarea id="captureInput" rows="1" placeholder="今天想到了什么问题？" autocomplete="off"></textarea>
        <button id="pasteSim" title="模拟从外部粘贴">⌘V</button>
      </div>
      <div class="stats" id="stats"></div>
    </div>
    <div class="garden" id="garden"></div>
  </section>

  <!-- 详情 -->
  <section id="detail" class="screen">
    <div class="detail">
      <button class="back" id="backBtn">‹</button>
      <div class="d-meta">
        <span id="dDate"></span>
        <button class="resolve" id="resolveBtn">标记已解决</button>
      </div>
      <div class="d-q" id="dQ"></div>
      <div class="d-life" id="dLife"></div>
      <div class="nutrients" id="nutrients"></div>
      <div class="no-nutrient" id="noNutrient">还没有养分。贴一个回答或路径，这颗种子就开始长了。</div>
    </div>
    <div class="attach-row">
      <button class="attach-open" id="attachOpen">＋ 贴一个回答 / 路径</button>
      <div class="attach-box" id="attachBox">
        <input id="nutrientInput" type="text" placeholder="一段话，或一个链接" autocomplete="off">
        <div class="attach-tip">回车附着 · <b>它会落在链尾</b></div>
      </div>
    </div>
  </section>

  <!-- 附着选择器（外部链接分流） -->
  <div id="chooser">
    <h2>贴在哪个问题下？</h2>
    <div class="sub" id="chooserLink"></div>
    <div id="choiceList"></div>
    <button class="cancel" id="chooserCancel">取消</button>
  </div>
</div>

<script>
/* ===== 数据：优先读本地（PWA 后台被回收也不丢），冷启动才用 Mock ===== */
const DAY=86400000;
const LS_KEY="quesden_data";
function defaultSeeds(){
  const now=Date.now();
  const seeds=[
    { id:1, t:"怎么做才能让「记录」这件事不变成负担？", at:now-3600e3, resolved:false, ns:[
      { txt:"也许先别想「负担」，先记满 7 天再说", at:now-3600e3 },
      { txt:"https://example.com/anti-todo 反待办清单的做法", at:now-7200e3 } ]},
    { id:2, t:"为什么我总是记住结论，忘记问题本身？", at:now-DAY, resolved:false, ns:[
      { txt:"因为结论好复述，问题需要重演。学校只教前者", at:now-DAY-86400e3 } ]},
    { id:3, t:"一个没有养分的种子长什么样？", at:now-DAY-6*DAY, resolved:false, ns:[] }
  ];
  /* ===== 极限走查数据：50 颗种子 / 20 条养分（仅冷启动生成一次，落库后不再重放）===== */
  const qs=["回顾的粒度应该多细？","灵感枯竭时该输出还是输入？","「想清楚」和「写清楚」哪个在前？","记录工具越多越好吗？","怎么判断一个问题值得追？","遗忘是bug还是特性？","碎片阅读到底有没有用？","该不该公开自己的问题？","问题会过期吗？","怎么给问题定性：事实还是价值？","好的回答长什么样？","为什么整理笔记让人上瘾？","问题花园和日记的区别是什么？","怎么避免记录变成表演？","领域标签真的需要吗？","什么时候该放弃一个问题？","别人会怎么回答我的问题？","问题的质量由什么决定？","记录的速度重要还是深度重要？","怎么处理重复出现的问题？","一个问题的生命周期多长？","该不该给问题设截止日？","怎么发现「我以为在想其实没在想」？","问题之间会不会互相吞噬？","灵感来的时候该记全还是记关键词？","回顾的频率多少合适？","怎么判断养分过期了？","该不该允许自己记无聊的问题？","问题的所有权属于谁？","怎么把问题变成行动？"];
  for(let i=0;i<qs.length;i++){
    seeds.push({ id:100+i, t:qs[i], at:now-DAY*(2+Math.floor(i*1.4)), resolved:false, ns:[] });
  }
  const nutris=["试着每周只回顾一次，别的都不看","https://example.com/spaced-repetition 间隔重复的做法","先区分「好奇心」和「焦虑」，前者能追，后者会跑","把问题写进周报，别人会替你记着","答案往往在第三个问题之后","用问题原句搜索，别用关键词","试过 30 天，结论：过期的问题不值得救","把回答贴在这里而不是记在心里","找到一篇讲「问题税」的文章 https://example.com/q-tax","复述一遍问题，答案常自己出现"];
  for(let i=0;i<20;i++){
    const target=seeds[i%7===0?0:(i%7===1?1:(i%7===2?4:5+i%6))];
    if(!target.ns) target.ns=[];
    /* 养分时间必须晚于种子：否则"最新养分在……"会早于"种下于……"，是数据不自洽 */
    target.ns.push({ txt:nutris[i%nutris.length], at:target.at+Math.round((i%9+1)*3600e3*(i%2+1)) });
  }
  return seeds;
}
let seeds, fallenHidden=false;
try {
  const saved=JSON.parse(localStorage.getItem(LS_KEY)||"null");
  if(saved && Array.isArray(saved.seeds) && saved.seeds.length){
    seeds=saved.seeds;
    fallenHidden=saved.fallenHidden===true;   /* 归档收起也是状态，一并续命 */
  } else seeds=defaultSeeds();
} catch(e){ seeds=defaultSeeds(); }   /* 坏数据/隐私模式：退回 Mock，不白屏 */

function saveData(){
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({ v:1, at:Date.now(), fallenHidden, seeds }));
  } catch(e) { /* 配额满/隐私模式：内存态照常可用，只是不持久 */ }
}
let cur=null, pendingLink=null;

/* ===== 工具 ===== */
function dayLabel(ts){
  const d=new Date(ts), n=new Date(), today=new Date(n.getFullYear(),n.getMonth(),n.getDate()).getTime();
  const day0=new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();
  const diff=Math.round((today-day0)/DAY);
  if(diff===0) return "今天"; if(diff===1) return "昨天";
  if(diff<7) return diff+" 天前";
  return (d.getMonth()+1)+" 月 "+d.getDate()+" 日";
}
function timeLabel(ts){ const d=new Date(ts);
  return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
function fmtLink(s){ return s.replace(/(https?:\/\/[^\s]+)/g,'<a href="#" onclick="return false">$1</a>'); }
function fullDate(ts){ const d=new Date(ts); return (d.getMonth()+1)+" 月 "+d.getDate()+" 日"; }
function lifeLine(s){
  let t="种下于 "+fullDate(s.at);
  if(s.ns.length){
    const last=s.ns[s.ns.length-1].at;
    /* 同一天只给时刻（够用且更轻）；跨天才带日期，避免"最新养分在 9 月 3 日"读不出远近 */
    t+=" · 最新养分在 "+(dayLabel(last)===dayLabel(s.at)?timeLabel(last):fullDate(last));
  }
  return t;
}
/* 凋谢归档：主页底部一行开关，不引入回收站（fallenHidden 随数据一起持久化，见顶部） */

/* ===== 吸顶锚点高度：捕获栏实时高度 → CSS 变量 ===== */
const capEl=document.getElementById("capture");
function syncCapH(){ document.documentElement.style.setProperty("--capture-h", capEl.offsetHeight+"px"); }
window.addEventListener("resize",syncCapH);

/* ===== 主页渲染：q 非空时原地过滤（无遮罩、无新页面） ===== */
function renderGarden(){
  const g=document.getElementById("garden"); g.innerHTML="";
  const q=document.getElementById("searchInput").value.trim();
  const total=seeds.reduce((n,s)=>n+s.ns.length,0);
  document.getElementById("stats").textContent =
    seeds.length?("共 "+seeds.length+" 颗种子 · "+total+" 条养分"):"";

  if(q){
    /* 检索态：检索是回忆者的工具，按相关命中直接平铺，日期分组暂时退场。
       检索穿透"收起"——收起是浏览时的减法，检索是明确索取，不该被减法挡住。 */
    const matched=seeds.filter(s=>s.t.includes(q)||s.ns.some(n=>n.txt.includes(q)))
                       .sort((a,b)=>b.at-a.at);
    const note=document.createElement("div"); note.className="search-note";
    note.innerHTML=`<span>匹配 ${matched.length} 颗 · 按「${q}」</span>`;
    const clr=document.createElement("button"); clr.textContent="清空";
    clr.onclick=()=>{ document.getElementById("searchInput").value=""; renderGarden(); };
    note.appendChild(clr); g.appendChild(note);
    matched.forEach(s=>g.appendChild(seedEl(s)));
  } else {
    const visible=seeds.filter(s=>!(fallenHidden&&s.resolved));
    const groups={};
    visible.sort((a,b)=>b.at-a.at).forEach(s=>(groups[dayLabel(s.at)] ||= []).push(s));
    for(const [label,list] of Object.entries(groups)){
      const sec=document.createElement("section"); sec.className="day-sec";
      const h=document.createElement("div"); h.className="day-label"; h.textContent=label; sec.appendChild(h);
      g.appendChild(sec);
      list.forEach(s=>sec.appendChild(seedEl(s)));
    }
    const fallen=seeds.filter(s=>s.resolved).length;
    if(fallen){
      const btn=document.createElement("button"); btn.className="fallen-row";
      btn.textContent=fallenHidden
        ? "已化作春泥的 "+fallen+" 株已收起 · 展开"
        : fallen+" 株已凋谢 · 收起";
      btn.onclick=()=>{ fallenHidden=!fallenHidden; saveData(); renderGarden(); };
      g.appendChild(btn);
    }
  }
  syncCapH();
}
function seedEl(s){
  const el=document.createElement("div");
  el.className="seed"+(s.resolved?" resolved":""); el.dataset.id=s.id;
  let html=`<div class="q">${s.t}</div>`;
  if(s.ns.length){
    const last=s.ns[s.ns.length-1];
    html+=`<div class="n-count">养分 ×${s.ns.length}</div>
           <div class="sprout">${fmtLink(last.txt)}${s.ns.length>1?`<span class="more">还有 ${s.ns.length-1} 条</span>`:""}</div>`;
  }
  el.innerHTML=html;
  el.onclick=()=>openSeed(s);
  return el;
}

/* ===== 详情 ===== */
function openSeed(s){
  cur=s;
  document.getElementById("dDate").textContent=dayLabel(s.at)+" "+timeLabel(s.at);
  const q=document.getElementById("dQ");
  q.textContent=s.t; q.classList.toggle("done",s.resolved);
  const rb=document.getElementById("resolveBtn");
  rb.textContent=s.resolved?"重新打开":"标记已解决"; rb.classList.toggle("done",s.resolved);
  renderNutrients();
  document.getElementById("dLife").textContent=lifeLine(s);
  document.getElementById("attachBox").classList.remove("on");
  document.getElementById("attachOpen").style.display="";
  document.getElementById("detail").classList.add("active");
  document.getElementById("home").classList.remove("active");
  /* 默认滚到链尾：我来看它最近长了什么 */
  requestAnimationFrame(()=>{ document.querySelector("#detail .detail").scrollTop=1e9; });
}
function renderNutrients(animateLast){
  const box=document.getElementById("nutrients"); box.innerHTML="";
  document.getElementById("noNutrient").style.display=cur.ns.length?"none":"";
  document.getElementById("dLife").textContent=lifeLine(cur);
  cur.ns.forEach((n,i)=>{
    const el=document.createElement("div");
    el.className="nutrient"+(animateLast&&i===cur.ns.length-1?" land":"");
    el.innerHTML=fmtLink(n.txt)+`<span class="when">${timeLabel(n.at)} 附着<span class="del">· 删除</span></span>`;
    el.querySelector(".when").onclick=(ev)=>{
      ev.stopPropagation();
      if(ev.target.classList.contains("del")){
        cur.ns.splice(cur.ns.indexOf(n),1); saveData(); renderNutrients();
      } else {
        document.querySelectorAll(".nutrient.confirm").forEach(x=>x!==el&&x.classList.remove("confirm"));
        el.classList.toggle("confirm");
      }
    };
    box.appendChild(el);
  });
}
document.getElementById("backBtn").onclick=()=>{
  document.getElementById("detail").classList.remove("active");
  document.getElementById("home").classList.add("active");
  renderGarden();
};
document.getElementById("resolveBtn").onclick=()=>{
  cur.resolved=!cur.resolved;
  document.getElementById("dQ").classList.toggle("done",cur.resolved);
  document.getElementById("resolveBtn").textContent=cur.resolved?"重新打开":"标记已解决";
  document.getElementById("resolveBtn").classList.toggle("done",cur.resolved);
  saveData();
};

/* ===== 贴养分 ===== */
document.getElementById("attachOpen").onclick=()=>{
  document.getElementById("attachOpen").style.display="none";
  document.getElementById("attachBox").classList.add("on");
  document.getElementById("nutrientInput").focus();
};
document.getElementById("nutrientInput").addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target.value.trim()){
    cur.ns.push({txt:e.target.value.trim(), at:Date.now()});
    e.target.value=""; saveData(); renderNutrients(true);
    document.getElementById("noNutrient").style.display="none";
  }
});

/* ===== 检索行：常态一行文字，点开才成为输入；输入即过滤，清空即恢复 ===== */
const searchRow=document.getElementById("searchRow");
const searchIn=document.getElementById("searchInput");
document.getElementById("findBtn").onclick=()=>{ searchRow.classList.add("open"); searchIn.focus(); };
searchIn.addEventListener("input",()=>{ if(document.getElementById("home").classList.contains("active")) renderGarden(); });
searchIn.addEventListener("keydown",e=>{
  if(e.key==="Enter") e.target.blur();
  if(e.key==="Escape"||(e.key==="Backspace"&&!e.target.value)){
    e.target.value=""; searchRow.classList.remove("open"); renderGarden(); e.target.blur();
  }
});
searchIn.addEventListener("blur",()=>{ if(!searchIn.value) searchRow.classList.remove("open"); });

/* ===== 捕获：回车落库；支持挂起养分（外部分流的"新建"路） ===== */
const cap=document.getElementById("captureInput");
function autoGrow(){ cap.style.height="auto"; cap.style.height=cap.scrollHeight+"px"; syncCapH(); }
cap.addEventListener("input",autoGrow);
cap.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey&&e.target.value.trim()){
    e.preventDefault();
    const s={ id:Date.now(), t:e.target.value.trim(), at:Date.now(), resolved:false, ns:[] };
    if(pendingLink){ s.ns.push({txt:pendingLink, at:Date.now()}); pendingLink=null; }
    seeds.push(s); e.target.value=""; e.target.style.height=""; e.target.blur();
    saveData(); renderGarden(); openSeed(s);
  }
});
cap.addEventListener("paste",e=>{
  const txt=(e.clipboardData||window.clipboardData).getData("text");
  if(/^https?:\/\/\S+$/i.test(txt.trim())){ e.preventDefault(); openChooser(txt.trim()); }
});

/* ===== 外部情境分流（模拟粘贴） ===== */
const SIM=[ "https://example.com/garden-metaphor 植物隐喻与记忆的文章",
            "把「想到什么就记什么」和「定期回顾」分开之后，负担好像真的小了" ];
let simIdx=0;
document.getElementById("pasteSim").onclick=()=>{
  const txt=SIM[simIdx++%SIM.length];
  if(/^https?:\/\/\S+/i.test(txt)) openChooser(txt);   // 链接 = 养分 → 选问题
  else { cap.value=txt; autoGrow(); cap.focus(); }      // 文本 = 种子 → 预填
};
function openChooser(link){
  pendingLink=link;
  document.getElementById("chooserLink").textContent="链接："+link.split(" ")[0];
  const list=document.getElementById("choiceList"); list.innerHTML="";
  const recent=[...seeds].sort((a,b)=>(b.ns.length?b.ns[b.ns.length-1].at:b.at)-(a.ns.length?a.ns[a.ns.length-1].at:a.at)).slice(0,3);
  recent.forEach(s=>{
    const el=document.createElement("div"); el.className="choice";
    el.innerHTML=`${s.t}<small>${dayLabel(s.at)} · 养分 ×${s.ns.length}</small>`;
    el.onclick=()=>{ s.ns.push({txt:link, at:Date.now()}); saveData();
      document.getElementById("chooser").classList.remove("on");
      openSeed(s); renderNutrients(true); };
    list.appendChild(el);
  });
  const nw=document.createElement("div"); nw.className="choice new";
  nw.textContent="作为新问题保存（链接将作为它的第一条养分）";
  nw.onclick=()=>{ document.getElementById("chooser").classList.remove("on");
    cap.focus(); /* pendingLink 已挂起，回车即落库并自动附着 */ };
  list.appendChild(nw);
  document.getElementById("chooser").classList.add("on");
}
document.getElementById("chooserCancel").onclick=()=>{
  pendingLink=null; document.getElementById("chooser").classList.remove("on");
};

renderGarden();

/* ===== PWA：注册 Service Worker（file:// 下静默跳过，需经 http(s) 访问） ===== */
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js").catch(()=>{ /* 原型：注册失败不提示，不打扰 */ });
}
</script>
</body>
